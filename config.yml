# 운영: main 에 저장(저장 후 1~2분 뒤 홈페이지 반영)
# 한빛이노텍 관리자 (Sveltia CMS) 설정 — docs/spec.md(v2.2) 기준
# 토큰·키는 이 파일에 쓰지 않는다. 로그인은 GitHub 세분화 토큰(PAT)으로 한다.
#
# [기존 글 전용 칸 보존]
# 빌드(hopage build/cms_posts.py)가 읽는 칸은 모두 아래 fields 에 선언한다. 선언하지 않은 칸은 저장 때 지워질 수 있기 때문이다.
# - 글자 하나짜리 칸(body_format, link1, link2, featured_label, featured_text): widget: hidden → 화면에 안 보이고, 기존 값을 그대로 다시 저장.
#   default 를 주지 않으므로 새 글에는 값이 생기지 않는다(새 글 body_format 이 비어 있어야 markdown 으로 변환됨).
# - 목록 칸(files): 하위 칸(no, source, stored, size)을 모두 선언한 list 로 둔다(구조를 정확히 알아야 안전하게 다시 저장됨).
#   접힌 상태로 보이며 "수정하지 마세요" 안내를 붙인다.

backend:
  name: github
  repo: hanbit595/hopage
  branch: main

media_folder: uploads
public_folder: /uploads
site_url: https://hanbitinnotech.com

collections:
  # ───────── 회사소식 ─────────
  - name: notice
    label: 회사소식
    label_singular: 회사소식
    description: "규정상 비공개 현장은 올리지 마세요(공개 저장소). 사진은 긴 변 1920px로 자동 축소됩니다."
    folder: cms/notice
    extension: md
    format: frontmatter
    create: true
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{title}} ({{date}})"
    sortable_fields: [date, title]
    fields:
      - { label: 제목, name: title, widget: string }
      - { label: 날짜, name: date, widget: datetime, format: "YYYY-MM-DD HH:mm:ss", default: "{{now}}", hint: "목록은 날짜·시각 최신순입니다." }
      - { label: 썸네일, name: thumbnail, widget: image, required: false, hint: "목록·메인 News 썸네일 1순위. 비우면 첨부 이미지 → 본문 첫 이미지." }
      - { label: 요약, name: summary, widget: text, required: false, hint: "메인 News 요약과 상세 페이지 검색엔진 설명(meta description)에 우선 사용. 비우면 메인 News는 본문 앞부분, 검색엔진 설명은 회사정보의 기본 설명문을 씁니다." }
      - { label: 임시저장(비공개), name: draft, widget: boolean, default: false, hint: "켜면 사이트에 나오지 않지만, 공개 저장소이므로 글 내용은 외부에서 볼 수 있습니다." }
      - { label: 본문, name: body, widget: markdown }
      # 기존 글 전용(보존용)
      - { label: 본문 형식, name: body_format, widget: hidden, required: false }
      - { label: 관련 링크1, name: link1, widget: hidden, required: false }
      - { label: 관련 링크2, name: link2, widget: hidden, required: false }
      - &files_field
        label: 첨부(기존 글 전용)
        name: files
        widget: list
        required: false
        collapsed: true
        hint: "이전한 기존 글의 첨부 목록입니다. 수정·삭제하지 마세요. 새 글은 비워 두세요."
        summary: "{{fields.source}}"
        fields:
          - { label: 번호, name: "no", widget: number, value_type: int, required: false }
          - { label: 원래 파일명, name: source, widget: string, required: false }
          - { label: 저장 경로, name: stored, widget: string }
          - { label: 크기(바이트), name: size, widget: number, value_type: int, required: false }

  # ───────── 시공사례 ─────────
  - name: media
    label: 시공사례
    label_singular: 시공사례
    description: "규정상 비공개 현장은 올리지 마세요(공개 저장소). 사진은 긴 변 1920px로 자동 축소됩니다."
    folder: cms/media
    extension: md
    format: frontmatter
    create: true
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "[{{category}}] {{title}} {{capacity}} ({{date}})"
    sortable_fields: [date, title, featured_order]
    fields:
      - { label: 현장명, name: title, widget: string, hint: "규정상 비공개 현장은 올리지 마세요(공개 저장소)." }
      - label: 분류
        name: category
        widget: select
        multiple: true
        min: 1
        options: [태양광발전장치, BIPV, 주차장태양광, 기타]
        hint: "1개 이상. 선택한 순서대로 [태양광발전장치,BIPV] 처럼 제목 앞에 붙습니다."
      - { label: 용량, name: capacity, widget: string, required: false, hint: "예: 99.9kW. 제목 뒤에 붙습니다." }
      - { label: 사업구분, name: program, widget: string, required: false, hint: "적으면 제목 뒤에 ' ㅣ 사업구분' 으로 붙습니다." }
      - { label: 날짜, name: date, widget: datetime, format: "YYYY-MM-DD HH:mm:ss", default: "{{now}}", hint: "목록은 날짜·시각 최신순입니다." }
      - { label: 썸네일, name: thumbnail, widget: image, required: false, hint: "목록 썸네일 1순위. 비우면 첨부 이미지 → 본문 첫 이미지. 사진은 긴 변 1920px로 자동 축소." }
      - { label: 요약, name: summary, widget: text, required: false, hint: "상세 페이지 검색엔진 설명(meta description)에 우선 사용. 비우면 회사정보의 기본 설명문을 씁니다." }
      - label: 갤러리
        name: gallery
        widget: list
        required: false
        hint: "상세 본문 아래에 사진으로 나옵니다. 사진은 긴 변 1920px로 자동 축소."
        field: { label: 이미지, name: image, widget: image }
      - { label: 메인 Our Project 노출, name: featured, widget: boolean, default: false, hint: "메인 카드는 최대 6건까지 나옵니다." }
      - { label: 메인 카드 순서, name: featured_order, widget: number, value_type: int, min: 1, required: false, hint: "작은 숫자가 먼저. 비우면 날짜 최신순." }
      - { label: 메인 카드 이미지, name: featured_image, widget: image, required: false, hint: "메인 카드 이미지 1순위. 비우면 썸네일 → 기존 규칙." }
      - { label: 임시저장(비공개), name: draft, widget: boolean, default: false, hint: "켜면 사이트에 나오지 않지만, 공개 저장소이므로 글 내용은 외부에서 볼 수 있습니다." }
      - { label: 본문, name: body, widget: markdown, required: false }
      # 기존 글 전용(보존용)
      - { label: 본문 형식, name: body_format, widget: hidden, required: false }
      - { label: 관련 링크1, name: link1, widget: hidden, required: false }
      - { label: 관련 링크2, name: link2, widget: hidden, required: false }
      - { label: 메인 카드 분류(기존), name: featured_label, widget: hidden, required: false }
      - { label: 메인 카드 문구(기존), name: featured_text, widget: hidden, required: false }
      - *files_field

  # ───────── E-Catalog ─────────
  - name: library
    label: E-Catalog
    label_singular: E-Catalog
    description: "규정상 비공개 현장은 올리지 마세요(공개 저장소). 사진은 긴 변 1920px로 자동 축소됩니다."
    folder: cms/library
    extension: md
    format: frontmatter
    create: true
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{title}} ({{date}})"
    sortable_fields: [date, title]
    fields:
      - { label: 제목, name: title, widget: string }
      - { label: 날짜, name: date, widget: datetime, format: "YYYY-MM-DD HH:mm:ss", default: "{{now}}", hint: "목록은 날짜·시각 최신순입니다." }
      - { label: 썸네일, name: thumbnail, widget: image, required: false, hint: "목록 썸네일 1순위. 비우면 첨부 이미지 → 본문 첫 이미지." }
      - { label: PDF 파일, name: file, widget: file, accept: application/pdf, hint: "필수. 다운로드 이름은 파일 이름 그대로입니다." }
      - { label: 요약, name: summary, widget: text, required: false, hint: "상세 페이지 검색엔진 설명(meta description)에 우선 사용. 비우면 회사정보의 기본 설명문을 씁니다." }
      - { label: 임시저장(비공개), name: draft, widget: boolean, default: false, hint: "켜면 사이트에 나오지 않지만, 공개 저장소이므로 글 내용은 외부에서 볼 수 있습니다." }
      - { label: 본문, name: body, widget: markdown, required: false }
      # 기존 글 전용(보존용)
      - { label: 본문 형식, name: body_format, widget: hidden, required: false }
      - { label: 관련 링크1, name: link1, widget: hidden, required: false }
      - { label: 관련 링크2, name: link2, widget: hidden, required: false }
      - *files_field

  # ───────── 회사 페이지 (P4-2) ─────────
  # hopage cms/pages/*.yml → build/cms_pages.py 가 읽어 고정 페이지를 만든다. 화면 모양은 그대로, 글자·사진·목록만 바뀐다.
  # 빌드가 읽는 칸은 화면에 안 나오는 칸(발급기관·날짜 등)까지 모두 선언한다(선언하지 않은 칸은 저장 때 지워질 수 있음).
  # 개수가 화면 스크립트·디자인과 맞물린 목록은 min/max + allow_add/allow_remove:false 로 개수를 막는다.
  # 주의: 관리자 화면으로 저장하면 yml 파일 안의 # 설명 주석은 사라진다(내용 안내는 아래 hint 로 옮김).
  - name: company
    label: 회사 페이지
    description: "회사 메뉴의 고정 페이지(인증 및 수상·연혁·회사소개·ESG 경영) 내용입니다. 화면 모양은 그대로이고 글자·사진·목록만 바뀝니다. 이미지는 기존 사진과 같은 방향·비율로 올리세요(인증서는 세로형 원본 그대로). 칸이 틀리면 빌드가 멈추고 기존 사이트가 유지됩니다."
    editor:
      preview: false
    files:
      # ── 인증 및 수상 (/page/cert.html) ──
      - name: cert
        label: 인증 및 수상
        file: cms/pages/cert.yml
        fields:
          - label: 구분(화면 순서)
            name: categories
            widget: list
            min: 1
            hint: "화면에 이 순서대로 묶음이 나옵니다. 노출 항목이 하나도 없는 구분은 통째로 숨겨집니다. 구분 이름을 바꾸거나 새로 만들면 아래 항목의 '구분' 선택지도 바꿔야 하므로 관리자에게 요청하세요."
            field: { label: 구분, name: category, widget: string }
          - label: 인증서·상장
            name: items
            widget: list
            summary: "[{{fields.category}}] {{fields.name}} ({{fields.order}})"
            hint: "인증서·상장 한 장마다 한 항목. 인증서 이미지는 세로형(A4 비율) 원본 그대로 올리세요. 자르거나 가로로 돌리거나 여백을 넣지 마세요(화면 칸이 세로형이라 가로 이미지는 찌그러져 보입니다)."
            fields:
              - { label: 구분, name: category, widget: select, options: [수상, 인증, 특허], hint: "위 '구분' 목록에 있는 이름이어야 합니다(없으면 빌드 실패)." }
              - { label: 명칭, name: name, widget: string, hint: "사진 아래에 나오는 글자." }
              - { label: 발급기관, name: issuer, widget: string, required: false, hint: "기록용. 지금 화면에는 나오지 않습니다." }
              - label: 날짜
                name: date
                widget: string
                required: false
                pattern: ['^(\d{4}-\d{2}(-\d{2})?)?$', "YYYY-MM-DD 또는 YYYY-MM 형식으로 적으세요(예: 2024-03-15)."]
                hint: "기록용. 지금 화면에는 나오지 않습니다. YYYY-MM-DD 또는 YYYY-MM."
              - { label: 인증서 이미지, name: image, widget: image, hint: "세로형(A4 비율) 스캔·사진 원본 그대로. 기존 이미지는 239×338px 입니다. 긴 변 1920px 넘으면 자동 축소." }
              - { label: 노출, name: visible, widget: boolean, default: true, hint: "끄면 화면에서 숨깁니다(내용은 남음)." }
              - { label: 순서, name: order, widget: number, value_type: int, min: 0, required: false, hint: "같은 구분 안에서 작은 숫자가 먼저. 같으면 목록에 적힌 순서." }

      # ── 연혁 (/page/history.html) ──
      - name: history
        label: 연혁
        file: cms/pages/history.yml
        fields:
          - label: 기간 묶음
            name: periods
            widget: list
            min: 1
            summary: "{{fields.title}}"
            hint: "위에서부터 이 순서로 나옵니다. 첫째 묶음은 사진 왼쪽, 둘째는 사진 오른쪽 … 번갈아 나옵니다."
            fields:
              - { label: 기간 제목, name: title, widget: string, hint: "사진 위 큰 글자. 예: Now - 2020" }
              - label: 주소 이름표
                name: anchor
                widget: string
                required: false
                pattern: ['^[A-Za-z0-9_-]*$', "영문·숫자·-·_ 만 쓸 수 있습니다."]
                hint: "페이지 안 바로가기용 id. 영문·숫자·-·_ 만. 비우면 his-1, his-2 … 다른 묶음과 겹치면 안 됩니다. 이미 있는 값은 바꾸지 마세요."
              - { label: 기간 사진, name: image, widget: image, hint: "가로형 사진(기존 597×343px 비율)." }
              - label: 연도
                name: years
                widget: list
                min: 1
                summary: "{{fields.year}}년"
                hint: "적은 순서와 상관없이 큰 연도가 위로 정렬됩니다. 같은 기간 안에 같은 연도를 두 번 만들지 마세요."
                fields:
                  - { label: 연도, name: year, widget: number, value_type: int, min: 1900, max: 2099, hint: "4자리 숫자. 예: 2026" }
                  - label: 월
                    name: months
                    widget: list
                    min: 1
                    summary: "{{fields.month}}월"
                    hint: "큰 달이 위로 정렬됩니다."
                    fields:
                      - { label: 월, name: month, widget: select, options: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"] }
                      - label: 내용
                        name: items
                        widget: list
                        min: 1
                        hint: "그 달의 내용(1개 이상). 2개를 적으면 한 줄에 2칸으로 나옵니다. <br> 로 줄을 나눌 수 있습니다."
                        field: { label: 내용, name: item, widget: text }

      # ── 회사소개 (/page/hanbit.html) ──
      - name: hanbit
        label: 회사소개
        file: cms/pages/hanbit.yml
        fields:
          - label: 맨 위 큰 화면
            name: hero
            widget: object
            fields:
              - { label: 큰 제목, name: title, widget: string }
              - { label: 배경 사진, name: image, widget: image, hint: "넓은 가로형 사진(기존 2545×1305px). 긴 변 1920px 넘으면 자동 축소." }
          - label: 검은 화면 문단(3개 고정)
            name: intro_texts
            widget: list
            min: 3
            max: 3
            allow_add: false
            allow_remove: false
            hint: "꼭 3개. 화면 움직임과 맞물려 있어 추가·삭제할 수 없습니다. <br>(줄바꿈)·<b>(굵게) 사용 가능."
            field: { label: 문단, name: text, widget: text }
          - label: 함께 올라오는 사진(6장 고정)
            name: photos
            widget: list
            min: 6
            max: 6
            allow_add: false
            allow_remove: false
            hint: "꼭 6장. 2장씩 3단(1·2 → 3·4 → 5·6). 추가·삭제할 수 없고 사진만 바꿀 수 있습니다. 기존 사진과 같은 방향으로 올리세요(4번째만 가로형, 나머지는 세로형)."
            field: { label: 사진, name: photo, widget: image }
          - { label: 넓은 배경 사진 위 문단, name: energy_text, widget: text, hint: "배경 사진은 디자인에 고정되어 바꿀 수 없습니다. <br> 사용 가능." }
          - label: 해 사진 옆 문단(2개 고정)
            name: sun_texts
            widget: list
            min: 2
            max: 2
            allow_add: false
            allow_remove: false
            hint: "꼭 2개. 추가·삭제할 수 없습니다. 사진은 디자인에 고정. <br> 사용 가능."
            field: { label: 문단, name: text, widget: text }
          - { label: 마지막 문장, name: ending_text, widget: text, hint: "<br>(줄바꿈)·<b>(굵게) 사용 가능." }

      # ── ESG 경영 (/page/esg.html) ──
      - name: esg
        label: ESG 경영
        file: cms/pages/esg.yml
        fields:
          - label: 소개
            name: intro
            widget: object
            hint: "맨 위 큰 화면 문구(에너지를 넘어, …)는 여러 페이지 공통 문구라 여기서 바꾸지 않습니다."
            fields:
              - { label: 소개 제목, name: title, widget: string, hint: "글자 그대로 나옵니다(HTML 안 됨)." }
              - { label: 소개 문단, name: text, widget: text, hint: "<br> 사용 가능." }
          - { label: 원 위로 흐르는 글자, name: flow_text, widget: string }
          - label: 원 3개(E·S·G 고정)
            name: pillars
            widget: list
            min: 3
            max: 3
            allow_add: false
            allow_remove: false
            summary: "{{fields.title}}"
            hint: "꼭 3개(왼쪽→오른쪽). 디자인상 원 3개라 추가·삭제할 수 없습니다."
            fields:
              - { label: 원 제목, name: title, widget: string }
              - { label: 아이콘, name: icon, widget: image, hint: "정사각형 투명 배경 PNG(기존 81×81px)." }
              - { label: 설명, name: text, widget: text, hint: "<br> 사용 가능." }
          - label: 아래 상세 상자
            name: details
            widget: list
            min: 1
            summary: "{{fields.title}}"
            fields:
              - { label: 상자 제목, name: title, widget: string }
              - label: 항목
                name: items
                widget: list
                min: 1
                field: { label: 항목, name: item, widget: string }

  # ───────── 사이트 관리 ─────────
  - name: settings
    label: 사이트 관리
    description: "회사정보·기본설정의 사업장 주소·대표전화·이메일은 Contact 페이지와 하단 푸터에 함께 반영됩니다(Contact 메뉴는 따로 없음)."
    editor:
      preview: false
    files:
      - name: menu
        label: 메뉴 관리
        file: cms/settings/menu.yml
        fields:
          - label: 대메뉴
            name: menu
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: 메뉴명, name: label, widget: string }
              - { label: 링크, name: link, widget: string, required: false, hint: "비우면 첫 번째 노출 소메뉴로 이동합니다. /로 시작하면 내부 링크(사이트에 없으면 빌드 실패), http로 시작하면 외부 링크." }
              - { label: 노출, name: visible, widget: boolean, default: true }
              - { label: 화면 클래스, name: class, widget: string, required: false, hint: "비워두면 자동으로 붙습니다. 건드리지 마세요." }
              - label: 소메뉴
                name: items
                widget: list
                summary: "{{fields.label}} → {{fields.link}}"
                fields:
                  - { label: 메뉴명, name: label, widget: string }
                  - { label: 링크, name: link, widget: string, hint: "/로 시작하면 내부 링크(사이트에 없으면 빌드 실패), http로 시작하면 외부 링크." }
                  - { label: 새 창으로 열기, name: new_window, widget: boolean, default: false }
                  - { label: 노출, name: visible, widget: boolean, default: true }
                  - { label: 화면 클래스, name: class, widget: string, required: false, hint: "비워두면 자동으로 붙습니다. 건드리지 마세요." }

      - name: site
        label: 회사정보·기본설정
        file: cms/settings/site.yml
        fields:
          - label: 사업장
            name: offices
            widget: list
            min: 1
            summary: "{{fields.name}}"
            hint: "Contact 페이지와 하단 푸터(한글 모든 페이지·메인)에 함께 반영됩니다."
            fields:
              - { label: 사업장명, name: name, widget: string, hint: "Contact 페이지 지도 설정이 이 이름으로 연결되어 있어, 바꾸거나 지우면 빌드가 멈춥니다. 바꿀 때는 관리자에게 요청하세요." }
              - { label: 주소, name: address, widget: string, hint: "Contact 페이지와 하단 푸터에 함께 반영." }
          - { label: 대표전화, name: tel, widget: string, hint: "Contact 페이지와 하단 푸터에 함께 반영. +82-51-913-0120 형식으로 적으면 Contact 에는 051-913-0120 으로 나옵니다." }
          - { label: 이메일, name: email, widget: string, hint: "Contact 페이지와 하단 푸터에 함께 반영." }
          - { label: 회사소개서(PDF), name: brochure, widget: file, accept: application/pdf, hint: "/로 시작하는 사이트 안 주소(사이트에 없으면 빌드 실패) 또는 http 주소." }
          - { label: 게시판 페이지당 글 수, name: per_page, widget: number, value_type: int, min: 1, default: 7, hint: "회사소식·시공사례·E-Catalog 목록 한 쪽당 글 수." }
          - { label: 검색엔진 설명(SEO), name: seo_description, widget: text, hint: "한글 메인·게시판 페이지의 meta description. 요약이 없는 글의 상세 페이지에도 쓰입니다." }

      - name: popups
        label: 메인 팝업
        file: cms/settings/popups.yml
        fields:
          - label: 팝업
            name: popups
            widget: list
            required: false
            summary: "{{fields.title}} ({{fields.start}} ~ {{fields.end}})"
            hint: "노출 기간은 방문자 브라우저에서 오늘 날짜(한국 시간)로 판단합니다. 시작일 0시부터 종료일 당일 23:59까지 노출."
            fields:
              - { label: 제목, name: title, widget: string }
              - { label: 이미지, name: image, widget: image, hint: "사용 중인 팝업은 필수." }
              - { label: 링크, name: link, widget: string, required: false, hint: "이미지를 누르면 갈 주소. 비우면 링크 없음." }
              - { label: 시작일, name: start, widget: datetime, time_format: false, date_format: YYYY-MM-DD, format: YYYY-MM-DD }
              - { label: 종료일, name: end, widget: datetime, time_format: false, date_format: YYYY-MM-DD, format: YYYY-MM-DD, hint: "종료일 당일 23:59까지 노출." }
              - { label: 사용, name: active, widget: boolean, default: true, hint: "끄면 사이트에 넣지 않습니다." }
              - { label: 번호, name: id, widget: number, value_type: int, min: 1, required: false, hint: "'24시간 보지 않기' 기억용. 다른 팝업과 겹치면 안 됨. 비우면 순서 번호." }
              - { label: 너비(px), name: width, widget: number, value_type: int, min: 0, required: false, hint: "비우면 450" }
              - { label: 높이(px), name: height, widget: number, value_type: int, min: 0, required: false, hint: "비우면 660" }
              - { label: 위쪽 위치(px), name: top, widget: number, value_type: int, min: 0, required: false, hint: "비우면 150" }
              - { label: 왼쪽 위치(px), name: left, widget: number, value_type: int, min: 0, required: false, hint: "비우면 10" }

  # ═════════ 영문(P4-EN1) — 국문과 완전히 분리(hopage cms/en/). 국문 데이터를 읽거나 쓰지 않는다 ═════════
  # 빌드(build/cms_pages.py PAGES_EN)가 읽는 칸을 모두 선언한다. 파일(이미지·동영상)만 국문과 공유한다.
  # 주의: 관리자 화면으로 저장하면 yml 파일 안의 # 설명 주석은 사라진다(내용 안내는 아래 hint 로 옮김).

  # ───────── [EN] 회사 페이지 ─────────
  - name: company_en
    label: "[EN] 회사 페이지"
    description: "영문 회사 페이지(Certifications·History·About·ESG·Contact) 내용입니다. 국문 페이지를 바꿨다면 영문도 함께 확인하세요. 사진은 국문에서 올린 파일을 선택하면 됩니다."
    editor:
      preview: false
    files:
      # ── Certifications (/en/page/cert.html) ──
      - name: cert_en
        label: "[EN] 인증 및 수상 (Certifications)"
        file: cms/en/pages/cert.yml
        fields:
          - label: 구분(화면 순서)
            name: categories
            widget: list
            min: 1
            hint: "화면에 이 순서대로 묶음이 나옵니다. 노출 항목이 하나도 없는 구분은 통째로 숨겨집니다. 구분 이름을 바꾸거나 새로 만들면 아래 항목의 '구분' 선택지도 바꿔야 하므로 관리자에게 요청하세요."
            field: { label: 구분, name: category, widget: string }
          - label: 인증서·상장
            name: items
            widget: list
            summary: "[{{fields.category}}] {{fields.name}} ({{fields.order}})"
            hint: "국문 페이지를 바꿨다면 영문도 함께 확인하세요. 사진은 국문에서 올린 파일을 선택하면 됩니다. 인증서 이미지는 세로형(A4 비율) 원본 그대로."
            fields:
              - { label: 구분, name: category, widget: select, options: [Awards, Certifications, Patents], hint: "위 '구분' 목록에 있는 이름이어야 합니다(없으면 빌드 실패)." }
              - { label: 명칭(영문), name: name, widget: string, hint: "사진 아래에 나오는 영문 글자." }
              - { label: 발급기관, name: issuer, widget: string, required: false, hint: "기록용. 지금 화면에는 나오지 않습니다." }
              - label: 날짜
                name: date
                widget: string
                required: false
                pattern: ['^(\d{4}-\d{2}(-\d{2})?)?$', "YYYY-MM-DD 또는 YYYY-MM 형식으로 적으세요(예: 2024-03-15)."]
                hint: "기록용. 지금 화면에는 나오지 않습니다. YYYY-MM-DD 또는 YYYY-MM."
              - { label: 인증서 이미지, name: image, widget: image, hint: "국문에서 올린 파일을 선택하면 됩니다. 세로형(A4 비율, 기존 239×338px) 원본 그대로." }
              - { label: 노출, name: visible, widget: boolean, default: true, hint: "끄면 영문 화면에서만 숨깁니다(국문과 별개)." }
              - { label: 순서, name: order, widget: number, value_type: int, min: 0, required: false, hint: "같은 구분 안에서 작은 숫자가 먼저. 같으면 목록에 적힌 순서." }

      # ── History (/en/page/history.html) ──
      - name: history_en
        label: "[EN] 연혁 (History)"
        file: cms/en/pages/history.yml
        fields:
          - label: 기간 묶음
            name: periods
            widget: list
            min: 1
            summary: "{{fields.title}}"
            hint: "국문 페이지를 바꿨다면 영문도 함께 확인하세요. 사진은 국문에서 올린 파일을 선택하면 됩니다. 위에서부터 이 순서로 나오고, 사진은 왼쪽·오른쪽 번갈아 나옵니다."
            fields:
              - { label: 기간 제목, name: title, widget: string, hint: "사진 위 큰 글자. 예: Now - 2020" }
              - label: 주소 이름표
                name: anchor
                widget: string
                required: false
                pattern: ['^[A-Za-z0-9_-]*$', "영문·숫자·-·_ 만 쓸 수 있습니다."]
                hint: "페이지 안 바로가기용 id. 영문·숫자·-·_ 만. 비우면 his-1, his-2 … 다른 묶음과 겹치면 안 됩니다. 이미 있는 값은 바꾸지 마세요."
              - { label: 기간 사진, name: image, widget: image, hint: "국문에서 올린 파일을 선택하면 됩니다. 가로형(기존 597×343px 비율)." }
              - label: 연도
                name: years
                widget: list
                min: 1
                summary: "{{fields.year}}"
                hint: "적은 순서와 상관없이 큰 연도가 위로 정렬됩니다. 같은 기간 안에 같은 연도를 두 번 만들지 마세요."
                fields:
                  - { label: 연도, name: year, widget: number, value_type: int, min: 1900, max: 2099, hint: "4자리 숫자. 예: 2026" }
                  - label: 월
                    name: months
                    widget: list
                    min: 1
                    summary: "{{fields.month}}"
                    hint: "큰 달이 위로 정렬됩니다."
                    fields:
                      - { label: 월, name: month, widget: select, options: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"] }
                      - label: 내용(영문)
                        name: items
                        widget: list
                        min: 1
                        hint: "그 달의 영문 내용(1개 이상). 2개를 적으면 한 줄에 2칸으로 나옵니다. <br> 로 줄을 나눌 수 있습니다."
                        field: { label: 내용, name: item, widget: text }

      # ── About (/en/page/hanbit.html) ──
      - name: hanbit_en
        label: "[EN] 회사소개 (About)"
        file: cms/en/pages/hanbit.yml
        fields:
          - label: 맨 위 큰 화면
            name: hero
            widget: object
            hint: "국문 페이지를 바꿨다면 영문도 함께 확인하세요. 사진은 국문에서 올린 파일을 선택하면 됩니다. 영문 맨 위는 사진이 아니라 배경 동영상입니다."
            fields:
              - { label: 큰 제목, name: title, widget: string }
              - { label: 배경 동영상, name: video, widget: file, accept: "video/*", hint: "동영상 파일(mp4 권장). 사진이 아닙니다. 기존 값 .mov 는 빌드가 바꾼 .mp4 를 씁니다. 파일이 사이트에 없으면 빌드 실패." }
          - label: 검은 화면 문단(3개 고정)
            name: intro_texts
            widget: list
            min: 3
            max: 3
            allow_add: false
            allow_remove: false
            hint: "꼭 3개. 화면 움직임과 맞물려 있어 추가·삭제할 수 없습니다. <br>(줄바꿈)·<b>(굵게) 사용 가능."
            field: { label: 문단, name: text, widget: text }
          - label: 함께 올라오는 사진(6장 고정)
            name: photos
            widget: list
            min: 6
            max: 6
            allow_add: false
            allow_remove: false
            hint: "꼭 6장. 2장씩 3단(1·2 → 3·4 → 5·6). 추가·삭제할 수 없고 사진만 바꿀 수 있습니다. 국문에서 올린 파일을 선택하면 됩니다(4번째만 가로형, 나머지는 세로형)."
            field: { label: 사진, name: photo, widget: image }
          - { label: 넓은 배경 사진 위 문단, name: energy_text, widget: text, hint: "배경 사진은 디자인에 고정되어 바꿀 수 없습니다. <br> 사용 가능." }
          - label: 해 사진 옆 문단(2개 고정)
            name: sun_texts
            widget: list
            min: 2
            max: 2
            allow_add: false
            allow_remove: false
            hint: "꼭 2개. 추가·삭제할 수 없습니다. 사진은 디자인에 고정. <br> 사용 가능."
            field: { label: 문단, name: text, widget: text }
          - { label: 마지막 문장, name: ending_text, widget: text, hint: "<br>(줄바꿈)·<b>(굵게) 사용 가능." }

      # ── ESG (/en/page/esg.html) ──
      - name: esg_en
        label: "[EN] ESG 경영 (ESG)"
        file: cms/en/pages/esg.yml
        fields:
          - label: 소개
            name: intro
            widget: object
            hint: "국문 페이지를 바꿨다면 영문도 함께 확인하세요. 사진은 국문에서 올린 파일을 선택하면 됩니다. 맨 위 큰 화면 문구는 여러 페이지 공통 문구라 여기서 바꾸지 않습니다."
            fields:
              - { label: 소개 제목, name: title, widget: string, hint: "글자 그대로 나옵니다(HTML 안 됨)." }
              - { label: 소개 문단, name: text, widget: text, hint: "<br> 사용 가능." }
          - { label: 원 위로 흐르는 글자, name: flow_text, widget: string }
          - label: 원 3개(E·S·G 고정)
            name: pillars
            widget: list
            min: 3
            max: 3
            allow_add: false
            allow_remove: false
            summary: "{{fields.title}}"
            hint: "꼭 3개(왼쪽→오른쪽). 디자인상 원 3개라 추가·삭제할 수 없습니다."
            fields:
              - { label: 원 제목, name: title, widget: string }
              - { label: 아이콘, name: icon, widget: image, hint: "국문에서 올린 파일을 선택하면 됩니다. 정사각형 투명 배경 PNG(기존 81×81px)." }
              - { label: 설명, name: text, widget: text, hint: "<br> 사용 가능." }
          - label: 아래 상세 상자
            name: details
            widget: list
            min: 1
            summary: "{{fields.title}}"
            fields:
              - { label: 상자 제목, name: title, widget: string }
              - label: 항목
                name: items
                widget: list
                min: 1
                hint: "항목 앞의 '-' 는 화면이 자동으로 붙이므로 적지 마세요."
                field: { label: 항목, name: item, widget: string }

      # ── Contact (/en/page/location.html) ──
      - name: location_en
        label: "[EN] Contact"
        file: cms/en/pages/location.yml
        fields:
          - label: 사업장
            name: locations
            widget: list
            min: 1
            summary: "{{fields.title}}"
            hint: "국문 페이지를 바꿨다면 영문도 함께 확인하세요. 사진은 국문에서 올린 파일을 선택하면 됩니다. 위에서부터 이 순서로 나옵니다. 주소·연락처·메일은 '[EN] 회사정보'에서 고칩니다."
            fields:
              - { label: 연결할 사업장 이름, name: office, widget: string, hint: "'[EN] 회사정보'의 사업장 이름과 글자까지 똑같이(다르면 빌드 실패). 주소는 거기서 가져옵니다." }
              - { label: 작은 제목, name: label, widget: string, hint: "예: Headquarters. & 등 HTML 그대로." }
              - { label: 사업장 이름, name: title, widget: string, hint: "예: HANBIT Innotech Headquarters" }
              - label: 구글 지도 삽입 주소
                name: map
                widget: string
                pattern: ['^https://www\.google\.com/maps/embed', "https://www.google.com/maps/embed 로 시작해야 합니다."]
                hint: "구글 지도 > 공유 > 지도 퍼가기 의 src=\"…\" 안의 주소."
              # 빌드가 읽는 선택 칸(영문 파일에는 현재 없음). 값이 생겨도 저장 때 지워지지 않게 보존
              - { label: 들여쓰기(보존용), name: map_indent, widget: hidden, required: false }

  # ───────── [EN] 회사정보 ─────────
  - name: settings_en
    label: "[EN] 회사정보"
    description: "영문 전용 회사정보(국문 회사정보와 별개). 국문 페이지를 바꿨다면 영문도 함께 확인하세요. 사진은 국문에서 올린 파일을 선택하면 됩니다. 지금은 영문 Contact 페이지에만 반영되고, 영문 하단 푸터는 아직 연결 전입니다."
    editor:
      preview: false
    files:
      - name: site_en
        label: "[EN] 회사정보"
        file: cms/en/settings/site.yml
        fields:
          - label: 사업장
            name: offices
            widget: list
            min: 1
            summary: "{{fields.name}}"
            hint: "영문 Contact 페이지에 반영됩니다."
            fields:
              - { label: 사업장 이름, name: name, widget: string, hint: "'[EN] Contact'의 연결할 사업장 이름과 연결되어 있어, 바꾸거나 지우면 빌드가 멈춥니다. 바꿀 때는 Contact 쪽도 같이 바꾸세요." }
              - { label: 영문 주소, name: address, widget: string }
          - { label: 대표전화, name: tel, widget: string, hint: "+82-51-913-0120 형식. 영문 Contact 에는 051-913-0120 으로 바뀌어 나옵니다." }
          - { label: 이메일, name: email, widget: string }
