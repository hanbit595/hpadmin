# 시험용: P5 에서 main 으로 되돌릴 것
# 한빛이노텍 관리자 (Sveltia CMS) 설정 — docs/spec.md(v2.2) 기준
# 토큰·키는 이 파일에 쓰지 않는다. 로그인은 GitHub 세분화 토큰(PAT)으로 한다.
#
# [기존 글 전용 칸 보존]
# 빌드(hopage build/cms_posts.py)가 읽는 칸은 모두 아래 fields 에 선언한다. 선언하지 않은 칸은 저장 때 지워질 수 있기 때문이다.
# - 글자 하나짜리 칸(body_format, link1, link2, featured_label, featured_text): widget: hidden → 화면에 안 보이고, 기존 값을 그대로 다시 저장.
#   default 를 주지 않으므로 새 글에는 값이 생기지 않는다(새 글 body_format 이 비어 있어야 markdown 으로 변환됨).
# - 목록 칸(files): 하위 칸(no, source, stored, size)을 모두 선언한 list 로 둔다(구조를 정확히 알아야 안전하게 다시 저장됨).
#   접힌 상태로 보이며 "수정하지 마세요" 안내를 붙인다.

backend:
  name: github
  repo: hanbit595/hopage
  branch: admin-dev

media_folder: uploads
public_folder: /uploads
site_url: https://hanbitinnotech.com

collections:
  # ───────── 회사소식 ─────────
  - name: notice
    label: 회사소식
    label_singular: 회사소식
    description: "규정상 비공개 현장은 올리지 마세요(공개 저장소). 사진은 긴 변 1920px로 자동 축소됩니다."
    folder: cms/notice
    extension: md
    format: frontmatter
    create: true
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{title}} ({{date}})"
    sortable_fields: [date, title]
    fields:
      - { label: 제목, name: title, widget: string }
      - { label: 날짜, name: date, widget: datetime, format: "YYYY-MM-DD HH:mm:ss", default: "{{now}}", hint: "목록은 날짜·시각 최신순입니다." }
      - { label: 썸네일, name: thumbnail, widget: image, required: false, hint: "목록·메인 News 썸네일 1순위. 비우면 첨부 이미지 → 본문 첫 이미지." }
      - { label: 요약, name: summary, widget: text, required: false, hint: "메인 News 요약과 상세 페이지 검색엔진 설명(meta description)에 우선 사용. 비우면 메인 News는 본문 앞부분, 검색엔진 설명은 회사정보의 기본 설명문을 씁니다." }
      - { label: 임시저장(비공개), name: draft, widget: boolean, default: false, hint: "켜면 사이트에 나오지 않지만, 공개 저장소이므로 글 내용은 외부에서 볼 수 있습니다." }
      - { label: 본문, name: body, widget: markdown }
      # 기존 글 전용(보존용)
      - { label: 본문 형식, name: body_format, widget: hidden, required: false }
      - { label: 관련 링크1, name: link1, widget: hidden, required: false }
      - { label: 관련 링크2, name: link2, widget: hidden, required: false }
      - &files_field
        label: 첨부(기존 글 전용)
        name: files
        widget: list
        required: false
        collapsed: true
        hint: "이전한 기존 글의 첨부 목록입니다. 수정·삭제하지 마세요. 새 글은 비워 두세요."
        summary: "{{fields.source}}"
        fields:
          - { label: 번호, name: "no", widget: number, value_type: int, required: false }
          - { label: 원래 파일명, name: source, widget: string, required: false }
          - { label: 저장 경로, name: stored, widget: string }
          - { label: 크기(바이트), name: size, widget: number, value_type: int, required: false }

  # ───────── 시공사례 ─────────
  - name: media
    label: 시공사례
    label_singular: 시공사례
    description: "규정상 비공개 현장은 올리지 마세요(공개 저장소). 사진은 긴 변 1920px로 자동 축소됩니다."
    folder: cms/media
    extension: md
    format: frontmatter
    create: true
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "[{{category}}] {{title}} {{capacity}} ({{date}})"
    sortable_fields: [date, title, featured_order]
    fields:
      - { label: 현장명, name: title, widget: string, hint: "규정상 비공개 현장은 올리지 마세요(공개 저장소)." }
      - label: 분류
        name: category
        widget: select
        multiple: true
        min: 1
        options: [태양광발전장치, BIPV, 주차장태양광, 기타]
        hint: "1개 이상. 선택한 순서대로 [태양광발전장치,BIPV] 처럼 제목 앞에 붙습니다."
      - { label: 용량, name: capacity, widget: string, required: false, hint: "예: 99.9kW. 제목 뒤에 붙습니다." }
      - { label: 사업구분, name: program, widget: string, required: false, hint: "적으면 제목 뒤에 ' ㅣ 사업구분' 으로 붙습니다." }
      - { label: 날짜, name: date, widget: datetime, format: "YYYY-MM-DD HH:mm:ss", default: "{{now}}", hint: "목록은 날짜·시각 최신순입니다." }
      - { label: 썸네일, name: thumbnail, widget: image, required: false, hint: "목록 썸네일 1순위. 비우면 첨부 이미지 → 본문 첫 이미지. 사진은 긴 변 1920px로 자동 축소." }
      - { label: 요약, name: summary, widget: text, required: false, hint: "상세 페이지 검색엔진 설명(meta description)에 우선 사용. 비우면 회사정보의 기본 설명문을 씁니다." }
      - label: 갤러리
        name: gallery
        widget: list
        required: false
        hint: "상세 본문 아래에 사진으로 나옵니다. 사진은 긴 변 1920px로 자동 축소."
        field: { label: 이미지, name: image, widget: image }
      - { label: 메인 Our Project 노출, name: featured, widget: boolean, default: false, hint: "메인 카드는 최대 6건까지 나옵니다." }
      - { label: 메인 카드 순서, name: featured_order, widget: number, value_type: int, min: 1, required: false, hint: "작은 숫자가 먼저. 비우면 날짜 최신순." }
      - { label: 메인 카드 이미지, name: featured_image, widget: image, required: false, hint: "메인 카드 이미지 1순위. 비우면 썸네일 → 기존 규칙." }
      - { label: 임시저장(비공개), name: draft, widget: boolean, default: false, hint: "켜면 사이트에 나오지 않지만, 공개 저장소이므로 글 내용은 외부에서 볼 수 있습니다." }
      - { label: 본문, name: body, widget: markdown, required: false }
      # 기존 글 전용(보존용)
      - { label: 본문 형식, name: body_format, widget: hidden, required: false }
      - { label: 관련 링크1, name: link1, widget: hidden, required: false }
      - { label: 관련 링크2, name: link2, widget: hidden, required: false }
      - { label: 메인 카드 분류(기존), name: featured_label, widget: hidden, required: false }
      - { label: 메인 카드 문구(기존), name: featured_text, widget: hidden, required: false }
      - *files_field

  # ───────── E-Catalog ─────────
  - name: library
    label: E-Catalog
    label_singular: E-Catalog
    description: "규정상 비공개 현장은 올리지 마세요(공개 저장소). 사진은 긴 변 1920px로 자동 축소됩니다."
    folder: cms/library
    extension: md
    format: frontmatter
    create: true
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{title}} ({{date}})"
    sortable_fields: [date, title]
    fields:
      - { label: 제목, name: title, widget: string }
      - { label: 날짜, name: date, widget: datetime, format: "YYYY-MM-DD HH:mm:ss", default: "{{now}}", hint: "목록은 날짜·시각 최신순입니다." }
      - { label: 썸네일, name: thumbnail, widget: image, required: false, hint: "목록 썸네일 1순위. 비우면 첨부 이미지 → 본문 첫 이미지." }
      - { label: PDF 파일, name: file, widget: file, accept: application/pdf, hint: "필수. 다운로드 이름은 파일 이름 그대로입니다." }
      - { label: 요약, name: summary, widget: text, required: false, hint: "상세 페이지 검색엔진 설명(meta description)에 우선 사용. 비우면 회사정보의 기본 설명문을 씁니다." }
      - { label: 임시저장(비공개), name: draft, widget: boolean, default: false, hint: "켜면 사이트에 나오지 않지만, 공개 저장소이므로 글 내용은 외부에서 볼 수 있습니다." }
      - { label: 본문, name: body, widget: markdown, required: false }
      # 기존 글 전용(보존용)
      - { label: 본문 형식, name: body_format, widget: hidden, required: false }
      - { label: 관련 링크1, name: link1, widget: hidden, required: false }
      - { label: 관련 링크2, name: link2, widget: hidden, required: false }
      - *files_field

  # ───────── 사이트 관리 ─────────
  - name: settings
    label: 사이트 관리
    editor:
      preview: false
    files:
      - name: menu
        label: 메뉴 관리
        file: cms/settings/menu.yml
        fields:
          - label: 대메뉴
            name: menu
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: 메뉴명, name: label, widget: string }
              - { label: 링크, name: link, widget: string, required: false, hint: "비우면 첫 번째 노출 소메뉴로 이동합니다. /로 시작하면 내부 링크(사이트에 없으면 빌드 실패), http로 시작하면 외부 링크." }
              - { label: 노출, name: visible, widget: boolean, default: true }
              - { label: 화면 클래스, name: class, widget: string, required: false, hint: "비워두면 자동으로 붙습니다. 건드리지 마세요." }
              - label: 소메뉴
                name: items
                widget: list
                summary: "{{fields.label}} → {{fields.link}}"
                fields:
                  - { label: 메뉴명, name: label, widget: string }
                  - { label: 링크, name: link, widget: string, hint: "/로 시작하면 내부 링크(사이트에 없으면 빌드 실패), http로 시작하면 외부 링크." }
                  - { label: 새 창으로 열기, name: new_window, widget: boolean, default: false }
                  - { label: 노출, name: visible, widget: boolean, default: true }
                  - { label: 화면 클래스, name: class, widget: string, required: false, hint: "비워두면 자동으로 붙습니다. 건드리지 마세요." }

      - name: site
        label: 회사정보·기본설정
        file: cms/settings/site.yml
        fields:
          - label: 사업장
            name: offices
            widget: list
            min: 1
            summary: "{{fields.name}}"
            hint: "한글 모든 페이지 하단 푸터와 메인 푸터에 나옵니다."
            fields:
              - { label: 사업장명, name: name, widget: string }
              - { label: 주소, name: address, widget: string }
          - { label: 대표전화, name: tel, widget: string }
          - { label: 이메일, name: email, widget: string }
          - { label: 회사소개서(PDF), name: brochure, widget: file, accept: application/pdf, hint: "/로 시작하는 사이트 안 주소(사이트에 없으면 빌드 실패) 또는 http 주소." }
          - { label: 게시판 페이지당 글 수, name: per_page, widget: number, value_type: int, min: 1, default: 7, hint: "회사소식·시공사례·E-Catalog 목록 한 쪽당 글 수." }
          - { label: 검색엔진 설명(SEO), name: seo_description, widget: text, hint: "한글 메인·게시판 페이지의 meta description. 요약이 없는 글의 상세 페이지에도 쓰입니다." }

      - name: popups
        label: 메인 팝업
        file: cms/settings/popups.yml
        fields:
          - label: 팝업
            name: popups
            widget: list
            required: false
            summary: "{{fields.title}} ({{fields.start}} ~ {{fields.end}})"
            hint: "노출 기간은 방문자 브라우저에서 오늘 날짜(한국 시간)로 판단합니다. 시작일 0시부터 종료일 당일 23:59까지 노출."
            fields:
              - { label: 제목, name: title, widget: string }
              - { label: 이미지, name: image, widget: image, hint: "사용 중인 팝업은 필수." }
              - { label: 링크, name: link, widget: string, required: false, hint: "이미지를 누르면 갈 주소. 비우면 링크 없음." }
              - { label: 시작일, name: start, widget: datetime, time_format: false, date_format: YYYY-MM-DD, format: YYYY-MM-DD }
              - { label: 종료일, name: end, widget: datetime, time_format: false, date_format: YYYY-MM-DD, format: YYYY-MM-DD, hint: "종료일 당일 23:59까지 노출." }
              - { label: 사용, name: active, widget: boolean, default: true, hint: "끄면 사이트에 넣지 않습니다." }
              - { label: 번호, name: id, widget: number, value_type: int, min: 1, required: false, hint: "'24시간 보지 않기' 기억용. 다른 팝업과 겹치면 안 됨. 비우면 순서 번호." }
              - { label: 너비(px), name: width, widget: number, value_type: int, min: 0, required: false, hint: "비우면 450" }
              - { label: 높이(px), name: height, widget: number, value_type: int, min: 0, required: false, hint: "비우면 660" }
              - { label: 위쪽 위치(px), name: top, widget: number, value_type: int, min: 0, required: false, hint: "비우면 150" }
              - { label: 왼쪽 위치(px), name: left, widget: number, value_type: int, min: 0, required: false, hint: "비우면 10" }
